[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "onchain-analyst"
version = "0.1.0"
description = "Optional toolkit for the Onchain Analyst bot: keyless, read-only on-chain analytics (Hyperliquid builders, Polymarket, DefiLlama)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "lz4==4.4.5",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
onchain = "onchain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/onchain"]

[tool.hatch.build.targets.wheel.force-include]
"registry/apps.yaml" = "onchain/data/apps.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits public endpoints (opt-in with -m live)"]
addopts = "-m 'not live'"
