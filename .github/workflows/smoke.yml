name: live-smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install toolkit
        run: pip install -e ".[dev]"
      - name: Toolkit doctor (keyless endpoints)
        run: onchain doctor --live
      - name: Raw skill snippets with plain python3 (no packages)
        run: pytest -m live tests/snippets -q
