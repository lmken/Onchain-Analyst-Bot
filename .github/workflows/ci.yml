name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Skill lint
        run: python scripts/lint_skills.py
      - name: Manifest up to date
        run: python scripts/build_manifest.py --check
      - name: Unit tests (offline)
        run: pytest -q
