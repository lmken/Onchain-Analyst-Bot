# Onchain Analyst app registry.
# Each entry maps an app to its public on-chain identifiers.
#   verified.method: referral  = HL info `referral.builderRewards` > 0
#                    feed      = a builder_fills day file exists
#                    leaderboard = listed on the Polymarket builders leaderboard
#                    llama     = DefiLlama /summary/fees/{slug} returns 200
# Addresses are lowercase. Lifetime figures are snapshots, not live values.
