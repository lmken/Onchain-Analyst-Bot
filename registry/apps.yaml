  - id: fomo
    name: FOMO
    category: trading-app
    notes: "Two builder addresses; the default view sums both."
    hyperliquid:
      builders:
        - address: "0x2a2b6b093a9813fbd8cddae800c3d17d46460d17"
          label: social-trading
          first_seen: 2026-06-05
          verified: {at: 2026-10-17, method: [referral, feed], lifetime_rewards_usd: 2904113}
        - address: "0xb838e4d1c8bcf71fa8e63299d5aa3258c83d6adb"
          label: legacy
          verified: {at: 2026-10-17, method: [referral, feed], lifetime_rewards_usd: 110000}
    defillama: {slug: fomo, perps: fomo-perps}
    sources: ["https://github.com/DefiLlama/dimension-adapters/blob/master/factory/hyperliquid.ts"]
    product:
      what: "Social trading app: self-custodial mobile swaps (Solana + cross-chain via Relay), copy-trading, Hyperliquid perps/HIP-3/spot/outcomes through a builder code."
      who_pays: "Traders, per trade (swap fee in USDC on Solana; Relay platform fee on EVM; HL builder fee)."
      sources: ["https://api.llama.fi/summary/fees/fomo (childProtocols methodology)", "https://fomo.family"]
      mapped: 2026-10-17
    product_lines:
      - id: hl-perps
        stream: builder-fees
        product: "Hyperliquid core perps routed with the app's builder code"
        chain: hyperliquid
        measure: {source: hl-builder, asset_class: perp}
        crosscheck: {defillama_child: "fomo Perps"}
      - id: hl-hip3
        stream: builder-fees
        product: "Hyperliquid HIP-3 (builder-deployed perp dexes, dex:COIN)"
        chain: hyperliquid
        measure: {source: hl-builder, asset_class: hip3}
        crosscheck: {maybe_in: "fomo Perps", note: "DefiLlama HL perps children include HIP-3 (day-level match 2026-10-17); it has missing days"}
      - id: hl-spot
        stream: builder-fees
        product: "Hyperliquid spot routed with the builder code"
        chain: hyperliquid
        measure: {source: hl-builder, asset_class: spot}
        crosscheck: {defillama_child: "fomo Spot"}
      - id: hl-outcome
        stream: builder-fees
        product: "Hyperliquid HIP-4 outcome markets routed with the builder code"
        chain: hyperliquid
        measure: {source: hl-builder, asset_class: outcome}
        crosscheck: {defillama_child: "fomo Outcome"}
      - id: wallet-swaps-solana
        stream: swap-fees
        product: "Native Solana token swaps in the app (USDC fee). DefiLlama also books unattributed Relay fees here."
        chain: solana
        identifiers:
          fee_owner: "R4rNJHaffSUotNmqSKNEfDcJE8A7zJUkaoM5Jkd7cYX"
          usdc_token_account: "HrTf9CzXR1dRH4Sof5QrpmGWwpwAf3qZzwCsEjQpXcSq"
          verified: {at: 2026-10-17, method: [solana-rpc-owner-lookup], note: "owner from prior research; USDC ATA resolved via public RPC"}
        measure: {source: defillama, parent: fomo, child: "fomo Wallet", chains: [Solana]}
        verify: {source: solana-token-inflow, account: "HrTf9CzXR1dRH4Sof5QrpmGWwpwAf3qZzwCsEjQpXcSq"}
      - id: wallet-swaps-evm-relay
        stream: swap-fees
        product: "Cross-chain trades via Relay, booked on the chain they settle on (Robinhood Chain, BNB, Ethereum, Base, Arc, Monad)"
        chain: evm
        identifiers: {note: "Relay platform-fee recipient not mapped yet; needs a traced transaction"}
        measure: {source: defillama, parent: fomo, child: "fomo Wallet", exclude_chains: [Solana]}
      - id: offchain
        stream: other
        product: "No off-chain revenue lines identified (no card, subscription or token sale found)"
        measure: {source: none}

